<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FANCY 凡希｜訂豆專員 — 結算明細</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon: #39FF14;
      --neon-dim: rgba(57, 255, 20, 0.5);
      --black: #0A0A0A;
      --white: #FFFFFF;
      --gray: #86868b;
      --light-gray: #f5f5f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', -apple-system, system-ui, sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .hero {
      background: var(--black);
      color: var(--white);
      padding: 36px 20px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(57, 255, 20, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(57, 255, 20, 0.05) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero .estd {
      position: absolute;
      top: 14px;
      right: 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--neon);
      text-transform: uppercase;
      z-index: 1;
    }
    .hero .logo-image {
      height: 60px;
      width: auto;
      margin: 0 auto 10px;
      display: block;
      filter:
        brightness(0) saturate(100%)
        invert(82%) sepia(82%)
        saturate(2476%) hue-rotate(63deg)
        brightness(115%) contrast(102%)
        drop-shadow(0 0 12px rgba(57, 255, 20, 0.6))
        drop-shadow(0 0 32px rgba(57, 255, 20, 0.3));
      position: relative;
      z-index: 1;
    }
    .hero .subtitle {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--white);
      opacity: 0.7;
      position: relative;
      z-index: 1;
    }
    .hero .marquee {
      margin-top: 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--neon);
      opacity: 0.6;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--gray);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .vendor-header {
      padding: 8px 0 18px;
      border-bottom: 2px solid var(--black);
      margin-bottom: 20px;
    }
    .vendor-header .label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 4px;
    }
    .vendor-header .name {
      font-size: 26px;
      font-weight: 900;
      color: var(--black);
    }
    .section-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin: 20px 0 12px;
    }
    .section-label::before {
      content: '// ';
      color: var(--neon);
    }
    /* Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .summary-card {
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: 18px;
      padding: 18px 20px;
      position: relative;
    }
    .summary-card.highlight {
      background: var(--black);
      color: var(--white);
    }
    .summary-card .label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--gray);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .summary-card.highlight .label {
      color: var(--neon);
    }
    .summary-card .amount {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--black);
      line-height: 1.1;
    }
    .summary-card.highlight .amount {
      color: var(--neon);
      text-shadow: 0 0 8px var(--neon-dim);
    }
    .summary-card .currency {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--gray);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-right: 4px;
    }
    .summary-card.highlight .currency {
      color: var(--neon);
      opacity: 0.7;
    }
    /* Payment Card */
    .payment-card {
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: 18px;
      padding: 16px 20px 14px 24px;
      margin-bottom: 12px;
      position: relative;
      transition: transform 0.15s;
    }
    .payment-card:hover {
      transform: translateX(2px);
    }
    .payment-card::before {
      content: '';
      position: absolute;
      top: 14px;
      bottom: 14px;
      left: 0;
      width: 5px;
      background: var(--neon);
      border-radius: 0 4px 4px 0;
      box-shadow: 0 0 10px var(--neon-dim);
    }
    .payment-card .row1 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .payment-card .pid {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--gray);
      text-transform: uppercase;
    }
    .payment-card .amount {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--black);
    }
    .payment-card .currency {
      font-size: 11px;
      color: var(--gray);
      letter-spacing: 2px;
      margin-right: 2px;
      text-transform: uppercase;
    }
    .payment-card .row2 {
      display: flex;
      justify-content: space-between;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--gray);
      text-transform: uppercase;
      margin-top: 4px;
    }
    .empty-state {
      background: var(--light-gray);
      padding: 40px 20px;
      text-align: center;
      color: var(--gray);
      font-size: 13px;
      border: 2px dashed var(--black);
      border-radius: 18px;
    }
    footer {
      padding: 32px 20px 28px;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 2.5px;
      color: var(--gray);
      text-transform: uppercase;
      border-top: 1px solid var(--light-gray);
      margin-top: 40px;
    }
    footer span { color: var(--neon); }
    .mock-toggle {
      position: fixed;
      top: 12px;
      left: 12px;
      background: var(--black);
      color: var(--neon);
      padding: 8px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      border: 2px solid var(--neon);
      border-radius: 10px;
      box-shadow: 0 0 16px var(--neon-dim);
      cursor: pointer;
      z-index: 9999;
      user-select: none;
    }
  </style>
</head>
<body>
  <header class="hero">
    <span class="estd">estd, 2020</span>
    <img src="logo.png" alt="FANCY" class="logo-image">
    <div class="subtitle">specialty coffee roasting co.</div>
    <div class="marquee">{ warning } you gonna join a fantastic journey</div>
  </header>

  <main>
    <div id="loading" class="loading">LOADING ...</div>

    <div id="paymentsContainer" style="display:none;">
      <div class="vendor-header">
        <div class="label">Client</div>
        <div class="name" id="vendorName"></div>
      </div>

      <div class="section-label">Settlement Summary</div>
      <div class="summary-grid">
        <div class="summary-card">
          <div class="label">Total Paid</div>
          <div class="amount"><span class="currency">NT$</span><span id="totalPaid">0</span></div>
        </div>
        <div class="summary-card highlight" id="unsettledCard">
          <div class="label">Pending Settlement</div>
          <div class="amount"><span class="currency">NT$</span><span id="totalUnsettled">0</span></div>
        </div>
      </div>

      <div class="section-label">Recent Payments</div>
      <div id="paymentsList"></div>
    </div>

    <div id="errorContainer" style="display:none;">
      <div class="empty-state" id="errorMessage">請先綁定帳號</div>
    </div>
  </main>

  <footer>
    FANCY 凡希咖啡 · estd <span>2020</span> · Taiwan
  </footer>

  <script>
    const LIFF_ID = '2010000242-X30U8OjR';
    const API_BASE = 'https://fancycaffe-bot.zeabur.app/webhook';
    let userId = null;

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        userId = profile.userId;
        await loadPayments();
      } catch (e) {
        console.error('LIFF init error:', e);
        document.getElementById('loading').textContent = 'INIT FAILED: ' + e.message;
      }
    }

    async function loadPayments() {
      try {
        const r = await fetch(`${API_BASE}/payments?userId=${encodeURIComponent(userId)}`);
        const data = await r.json();
        document.getElementById('loading').style.display = 'none';
        if (data.success) {
          showPayments(data);
        } else {
          showError(data.error || '請先綁定帳號');
        }
      } catch (e) {
        document.getElementById('loading').textContent = 'NETWORK ERROR: ' + e.message;
      }
    }

    function fmtNum(n) {
      return Number(n || 0).toLocaleString('en-US');
    }

    function showPayments(data) {
      document.getElementById('paymentsContainer').style.display = 'block';
      document.getElementById('errorContainer').style.display = 'none';
      document.getElementById('vendorName').textContent = data.vendor_name;
      document.getElementById('totalPaid').textContent = fmtNum(data.total_paid);
      document.getElementById('totalUnsettled').textContent = fmtNum(data.total_unsettled);

      // 待結算為 0 時 highlight 卡片不那麼搶眼
      const unsettledCard = document.getElementById('unsettledCard');
      if (Number(data.total_unsettled || 0) === 0) {
        unsettledCard.classList.remove('highlight');
      } else {
        unsettledCard.classList.add('highlight');
      }

      const list = document.getElementById('paymentsList');
      const payments = data.recent_payments || [];
      if (payments.length === 0) {
        list.innerHTML = `<div class="empty-state">尚無付款紀錄</div>`;
        return;
      }

      list.innerHTML = payments.map(p => {
        const date = p.paid_at ? new Date(p.paid_at).toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }) : '-';
        const method = p.method === 'bank_transfer' ? '銀行轉帳' :
                       p.method === 'cash' ? '現金' :
                       p.method === 'linepay' ? 'LINE Pay' :
                       (p.method || '-');
        return `
          <div class="payment-card">
            <div class="row1">
              <span class="pid">${p.payment_id || '-'}</span>
              <span><span class="currency">NT$</span><span class="amount">${fmtNum(p.amount)}</span></span>
            </div>
            <div class="row2">
              <span>${method}</span>
              <span>${date}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function showError(msg) {
      document.getElementById('paymentsContainer').style.display = 'none';
      document.getElementById('errorContainer').style.display = 'block';
      document.getElementById('errorMessage').textContent = msg;
    }

    // ==================== MOCK PREVIEW ====================
    const MOCK_MODE = typeof liff === 'undefined';

    if (MOCK_MODE) {
      runMockPreview();
    } else {
      init();
    }

    function runMockPreview() {
      const toggle = document.createElement('div');
      toggle.className = 'mock-toggle';
      toggle.textContent = '> Preview · Tap to toggle';
      let mockState = 'has-payments';
      toggle.onclick = () => {
        mockState = mockState === 'has-payments' ? 'empty' : 'has-payments';
        renderMock(mockState);
      };
      document.body.appendChild(toggle);
      renderMock('has-payments');
    }

    function renderMock(state) {
      document.getElementById('loading').style.display = 'none';
      if (state === 'empty') {
        showError('請先綁定帳號');
      } else {
        showPayments({
          success: true,
          vendor_id: 'V001',
          vendor_name: '木商咖啡',
          total_paid: 72000,
          total_unsettled: 8000,
          recent_payments: [
            { payment_id: 'P0001', amount: 36000, method: 'bank_transfer', paid_at: '2026-05-07' },
            { payment_id: 'P0002', amount: 36000, method: 'bank_transfer', paid_at: '2026-04-15' }
          ]
        });
      }
    }
  </script>
</body>
</html>
