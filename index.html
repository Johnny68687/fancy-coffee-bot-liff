<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FANCY 凡希｜訂豆專員</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon: #39FF14;
      --neon-dim: rgba(57, 255, 20, 0.5);
      --black: #0A0A0A;
      --white: #FFFFFF;
      --gray: #86868b;
      --light-gray: #f5f5f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      touch-action: pan-y;  /* 禁止 pinch-zoom，只允許垂直捲動 */
    }
    body {
      font-family: 'Noto Sans TC', -apple-system, system-ui, sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;  /* 防止 iOS 橫轉直時字體自動放大 */
    }

    /* ==================== HERO ==================== */
    .hero {
      background: var(--black);
      color: var(--white);
      padding: 36px 20px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(57, 255, 20, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(57, 255, 20, 0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    .hero .estd {
      position: absolute;
      top: 14px;
      right: 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--neon);
      text-transform: uppercase;
      z-index: 1;
    }

    .hero .logo-image {
      height: 60px;
      width: auto;
      margin: 0 auto 10px;
      display: block;
      /* 把黑色 logo 變螢光綠 + glow（兼容 file://）*/
      filter:
        brightness(0) saturate(100%)
        invert(82%) sepia(82%)
        saturate(2476%) hue-rotate(63deg)
        brightness(115%) contrast(102%)
        drop-shadow(0 0 12px rgba(57, 255, 20, 0.6))
        drop-shadow(0 0 32px rgba(57, 255, 20, 0.3));
      position: relative;
      z-index: 1;
    }

    .hero .subtitle {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--white);
      opacity: 0.7;
      position: relative;
      z-index: 1;
    }

    .hero .marquee {
      margin-top: 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--neon);
      opacity: 0.6;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    /* ==================== MAIN ==================== */
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--gray);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ==================== BIND FORM ==================== */
    .bind-form {
      background: var(--white);
      padding: 32px 24px;
      border: 2px solid var(--black);
      border-radius: 18px;
    }

    .bind-form h2 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 8px;
    }

    .bind-form .hint {
      font-size: 12px;
      color: var(--gray);
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .bind-form input {
      width: 100%;
      padding: 18px 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 16px;
      border: 2px solid var(--black);
      border-radius: 18px;
      background: var(--white);
      color: var(--black);
      margin-bottom: 16px;
      outline: none;
      transition: all 0.15s;
    }

    .bind-form input:focus {
      background: var(--black);
      color: var(--neon);
      border-color: var(--neon);
      box-shadow: 0 0 16px var(--neon-dim);
    }

    button {
      width: 100%;
      padding: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: var(--black);
      color: var(--neon);
      border: 2px solid var(--black);
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.15s;
    }

    button:hover, button:active {
      background: var(--neon);
      color: var(--black);
      border-color: var(--neon);
      box-shadow: 0 0 20px var(--neon-dim);
    }

    button:disabled {
      background: var(--light-gray);
      color: var(--gray);
      border-color: var(--light-gray);
      cursor: not-allowed;
      box-shadow: none;
    }

    .error {
      color: #ff3b30;
      font-size: 11px;
      text-align: center;
      margin-top: 12px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 1px;
    }

    /* ==================== VENDOR HEADER ==================== */
    .vendor-header {
      padding: 8px 0 18px;
      border-bottom: 2px solid var(--black);
      margin-bottom: 20px;
    }

    .vendor-header .label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 4px;
    }

    .vendor-header .name {
      font-size: 26px;
      font-weight: 900;
      color: var(--black);
    }

    .section-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin: 20px 0 12px;
    }

    .section-label::before {
      content: '// ';
      color: var(--neon);
    }

    /* ==================== DEPOSIT CARD ==================== */
    .deposit-card {
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: 18px;
      padding: 20px 20px 18px 24px;
      margin-bottom: 12px;
      position: relative;
      transition: transform 0.15s;
    }

    .deposit-card:hover {
      transform: translateX(2px);
    }

    .deposit-card::before {
      content: '';
      position: absolute;
      top: 14px;
      bottom: 14px;
      left: 0;
      width: 5px;
      background: var(--neon);
      border-radius: 0 4px 4px 0;
      box-shadow: 0 0 10px var(--neon-dim);
    }

    .deposit-card .deposit-id {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--gray);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .deposit-card .deposit-bean {
      font-size: 16px;
      font-weight: 700;
      color: var(--black);
      margin-bottom: 18px;
      line-height: 1.35;
    }

    .deposit-card .bean-id-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--gray);
      background: var(--light-gray);
      padding: 2px 8px;
      border-radius: 6px;
      margin-right: 6px;
      vertical-align: middle;
      font-weight: 500;
    }

    .deposit-card .balance-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .deposit-card .balance-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 38px;
      font-weight: 700;
      color: var(--black);
      line-height: 1;
    }

    .deposit-card .balance-total {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      color: var(--gray);
    }

    .deposit-card .balance-unit {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gray);
      text-transform: uppercase;
      margin-left: 4px;
    }

    .progress-bar {
      height: 8px;
      background: var(--black);
      position: relative;
      overflow: hidden;
      margin: 14px 0 10px;
      border-radius: 4px;
    }

    .progress-fill {
      height: 100%;
      background: var(--neon);
      box-shadow: 0 0 8px var(--neon-dim);
      transition: width 0.5s ease;
    }

    .deposit-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--gray);
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* ==================== ORDER BUTTON (P2) ==================== */
    .order-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      background: var(--black);
      color: var(--neon);
      border: 2px solid var(--black);
      border-radius: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }
    .order-btn:hover, .order-btn:active {
      background: var(--neon);
      color: var(--black);
      border-color: var(--neon);
      box-shadow: 0 0 16px var(--neon-dim);
    }
    .order-btn.add-to-cart::before {
      content: '+ ';
      color: var(--neon);
    }
    .order-btn.add-to-cart:hover::before, .order-btn.add-to-cart:active::before {
      color: var(--black);
    }
    .order-btn.edit-cart {
      background: var(--white);
      color: var(--black);
      border-color: var(--black);
    }
    .order-btn.edit-cart:hover, .order-btn.edit-cart:active {
      background: var(--black);
      color: var(--neon);
      border-color: var(--black);
      box-shadow: none;
    }

    /* ==================== DEPOSIT GROUP (Phase 2.6) ==================== */
    .deposit-count-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--black);
      color: var(--neon);
      border: 1px solid var(--neon);
      padding: 3px 10px;
      border-radius: 100px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 8px var(--neon-dim);
      transition: all 0.15s;
      margin-bottom: 6px;
    }
    .deposit-count-chip:active {
      background: var(--neon);
      color: var(--black);
    }

    /* Deposit detail modal — 列同支豆多筆 deposit */
    .deposit-detail-list {
      max-height: 60vh;
      overflow-y: auto;
      margin: 4px 0 16px;
    }
    .deposit-detail-item {
      padding: 14px 0;
      border-bottom: 1px solid var(--light-gray);
    }
    .deposit-detail-item:last-child {
      border-bottom: none;
    }
    .deposit-detail-item .did {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gray);
      margin-bottom: 4px;
    }
    .deposit-detail-item .qty-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 4px;
    }
    .deposit-detail-item .qty-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--black);
    }
    .deposit-detail-item .qty-total {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--gray);
    }
    .deposit-detail-item .qty-unit {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gray);
      text-transform: uppercase;
    }
    .deposit-detail-item .opened {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--gray);
      text-transform: uppercase;
    }

    /* Order modal — deposit selector */
    .modal .deposit-selector-wrap {
      margin: -4px 0 12px;
    }
    .modal .deposit-selector-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gray);
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }
    .modal .deposit-selector {
      width: 100%;
      padding: 10px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      border: 2px solid var(--black);
      border-radius: 10px;
      background: var(--white);
      color: var(--black);
      outline: none;
      cursor: pointer;
    }
    .modal .deposit-selector:focus {
      border-color: var(--neon);
      box-shadow: 0 0 12px var(--neon-dim);
    }

    /* ==================== CART BADGE (P2.5) ==================== */
    .cart-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--neon);
      color: var(--black);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      box-shadow: 0 0 12px var(--neon-dim);
      text-transform: uppercase;
    }

    /* ==================== CART FLOATING BAR (P2.5) ==================== */
    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: var(--black);
      color: var(--neon);
      border: 2px solid var(--neon);
      border-radius: 16px;
      padding: 16px 20px;
      display: none;
      align-items: center;
      justify-content: space-between;
      font-family: 'IBM Plex Mono', monospace;
      box-shadow: 0 4px 20px var(--neon-dim);
      cursor: pointer;
      z-index: 100;
      transition: transform 0.2s;
      max-width: 600px;
      margin: 0 auto;
    }
    .cart-bar.active { display: flex; }
    .cart-bar:hover { transform: translateY(-2px); }
    .cart-bar .cart-summary {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }
    .cart-bar .cart-icon {
      font-size: 20px;
    }
    .cart-bar .cart-count-text {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gray);
    }
    .cart-bar .cart-count-text .num {
      font-size: 17px;
      font-weight: 700;
      color: var(--neon);
      margin-right: 2px;
    }
    .cart-bar .submit-arrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--neon);
    }

    /* ==================== CART FULLSCREEN PAGE (P2.5) ==================== */
    .cart-page {
      position: fixed;
      inset: 0;
      background: var(--white);
      z-index: 2000;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .cart-page.active { display: flex; }
    .cart-page .cart-header {
      padding: 24px 20px 16px;
      border-bottom: 2px solid var(--black);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .cart-page .cart-header .close-cart {
      flex: 1;
    }
    .cart-page .cart-header .back-cart {
      background: var(--black);
      color: var(--neon);
      border: 2px solid var(--neon);
      border-radius: 10px;
      width: 44px;
      height: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px var(--neon-dim);
      transition: all 0.15s;
    }
    .cart-page .cart-header .back-cart:active {
      background: var(--neon);
      color: var(--black);
      box-shadow: 0 0 24px var(--neon-dim);
    }
    .cart-page .cart-header .back-cart svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .cart-page .cart-header .close-cart {
      background: var(--white);
      color: var(--black);
      border: 2px solid var(--black);
      border-radius: 10px;
      padding: 8px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
    }
    .cart-page .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 120px;
    }
    .cart-item {
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 12px;
      position: relative;
    }
    .cart-item::before {
      content: '';
      position: absolute;
      top: 14px;
      bottom: 14px;
      left: 0;
      width: 4px;
      background: var(--neon);
      border-radius: 0 4px 4px 0;
    }
    .cart-item .item-deposit-id {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gray);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .cart-item .item-bean {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.35;
    }
    .cart-item .item-qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .cart-item .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-item .qty-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border: 2px solid var(--black);
      background: var(--white);
      border-radius: 10px;
      padding: 0;
      cursor: pointer;
      font-size: 0;  /* hide any text content */
    }
    /* CSS-drawn 「−」 / 「+」 — 像素級置中，不依賴字體 */
    .cart-item .qty-btn.minus::before,
    .cart-item .qty-btn.plus::before,
    .cart-item .qty-btn.plus::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      background: var(--black);
      border-radius: 2px;
      transform: translate(-50%, -50%);
    }
    .cart-item .qty-btn.minus::before,
    .cart-item .qty-btn.plus::before {
      width: 14px;
      height: 3px;
    }
    .cart-item .qty-btn.plus::after {
      width: 3px;
      height: 14px;
    }
    .cart-item .qty-btn:active {
      background: var(--black);
    }
    .cart-item .qty-btn:active::before,
    .cart-item .qty-btn:active::after {
      background: var(--neon);
    }
    .cart-item .qty-input {
      width: 64px;
      padding: 6px 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      border: 2px solid var(--black);
      border-radius: 8px;
      background: var(--white);
      color: var(--black);
      outline: none;
      -moz-appearance: textfield;
    }
    .cart-item .qty-input::-webkit-outer-spin-button,
    .cart-item .qty-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .cart-item .qty-unit {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gray);
      text-transform: uppercase;
    }
    .cart-item .item-balance-hint {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--gray);
      text-transform: uppercase;
      margin-top: 4px;
    }
    .cart-item .remove-btn {
      background: transparent;
      border: none;
      color: var(--gray);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .cart-item .remove-btn:active {
      color: #ff3b30;
    }
    .cart-page .cart-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--white);
      border-top: 2px solid var(--black);
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cart-page .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: 'IBM Plex Mono', monospace;
    }
    .cart-page .cart-total .label {
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--gray);
      text-transform: uppercase;
    }
    .cart-page .cart-total .total-val {
      font-size: 22px;
      font-weight: 700;
      color: var(--black);
    }
    .cart-page .cart-total .total-val .unit {
      font-size: 11px;
      color: var(--gray);
      margin-left: 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .cart-page .cart-submit {
      width: 100%;
      padding: 16px;
      background: var(--black);
      color: var(--neon);
      border: 2px solid var(--black);
      border-radius: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .cart-page .cart-submit:active {
      background: var(--neon);
      color: var(--black);
      box-shadow: 0 0 16px var(--neon-dim);
    }
    .cart-page .cart-submit:disabled {
      background: var(--light-gray);
      color: var(--gray);
      border-color: var(--light-gray);
      cursor: not-allowed;
    }
    .cart-page .cart-empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--gray);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ==================== MODAL ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: 18px;
      padding: 28px 24px 24px;
      max-width: 360px;
      width: 100%;
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal h3 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 6px;
    }
    .modal .deposit-info {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .modal .balance-info {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--gray);
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .modal label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--gray);
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }
    .modal input[type="number"] {
      width: 100%;
      padding: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      border: 2px solid var(--black);
      border-radius: 12px;
      background: var(--white);
      color: var(--black);
      margin-bottom: 8px;
      outline: none;
      -moz-appearance: textfield;
    }
    .modal input[type="number"]::-webkit-outer-spin-button,
    .modal input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .modal input[type="number"]:focus {
      background: var(--black);
      color: var(--neon);
      border-color: var(--neon);
      box-shadow: 0 0 16px var(--neon-dim);
    }
    .modal .modal-error {
      color: #ff3b30;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 1px;
      min-height: 16px;
      margin-bottom: 14px;
      text-align: center;
    }
    .modal .modal-actions {
      display: flex;
      gap: 10px;
    }
    .modal .modal-actions button {
      flex: 1;
      padding: 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 12px;
      cursor: pointer;
    }
    .modal .modal-cancel {
      background: var(--white);
      color: var(--black);
      border: 2px solid var(--black);
    }
    .modal .modal-submit {
      background: var(--black);
      color: var(--neon);
      border: 2px solid var(--black);
    }
    .modal .modal-submit:disabled {
      background: var(--light-gray);
      color: var(--gray);
      border-color: var(--light-gray);
    }
    /* ==================== INTERACTIONS (P2.5) ==================== */
    /* A. Quick chips */
    .modal .quick-chips {
      display: flex;
      gap: 8px;
      margin: -4px 0 14px;
      flex-wrap: wrap;
    }
    .modal .chip {
      background: var(--white);
      border: 2px solid var(--black);
      color: var(--black);
      padding: 7px 14px;
      border-radius: 100px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.15s;
      flex: 1;
      min-width: 60px;
    }
    .modal .chip:active {
      background: var(--neon);
      transform: scale(0.94);
      box-shadow: 0 0 12px var(--neon-dim);
    }

    /* B. Flying pill */
    .flying-pill {
      position: fixed;
      background: var(--neon);
      color: var(--black);
      padding: 6px 14px;
      border-radius: 100px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 0 16px var(--neon-dim);
      pointer-events: none;
      z-index: 5000;
      letter-spacing: 1px;
    }

    /* C. Cart bar pulse */
    @keyframes barPulse {
      0% { transform: scale(1); box-shadow: 0 4px 20px var(--neon-dim); }
      40% { transform: scale(1.04); box-shadow: 0 0 32px var(--neon-dim), 0 0 64px rgba(57,255,20,0.3); }
      100% { transform: scale(1); box-shadow: 0 4px 20px var(--neon-dim); }
    }
    .cart-bar.pulsing { animation: barPulse 0.5s ease-out; }

    /* D. Button success state */
    .modal .modal-submit.success {
      background: var(--neon);
      color: var(--black);
      border-color: var(--neon);
      box-shadow: 0 0 16px var(--neon-dim);
    }
    .modal .modal-submit .check-svg {
      display: inline-block;
      width: 14px;
      height: 14px;
      vertical-align: middle;
      margin-right: 5px;
      stroke: currentColor;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* G. Progress bar deducted — 螢光綠斜紋（typical pending-pattern 語意）*/
    .deposit-card .progress-fill-deducted {
      position: absolute;
      top: 0;
      height: 100%;
      background: repeating-linear-gradient(
        -45deg,
        var(--neon),
        var(--neon) 3px,
        rgba(0, 0, 0, 0.85) 3px,
        rgba(0, 0, 0, 0.85) 7px
      );
      box-shadow: 0 0 6px var(--neon-dim);
      transition: width 0.4s ease, left 0.4s ease;
      border-radius: 0 4px 4px 0;
    }

    /* X. modal balance preview — 「579 → 449 LB（叫完後）」*/
    .modal .balance-info .bal-from {
      text-decoration: line-through;
      opacity: 0.55;
    }
    .modal .balance-info .bal-after {
      color: var(--black);
      font-weight: 700;
      font-size: 1.25em;
    }
    .modal .balance-info .bal-arrow {
      margin: 0 6px;
      color: var(--neon);
    }

    .modal .success-state {
      text-align: center;
      padding: 12px 0;
    }
    .modal .success-state .check {
      font-size: 48px;
      color: var(--neon);
      filter: drop-shadow(0 0 8px var(--neon-dim));
      margin-bottom: 12px;
    }
    .modal .success-state .order-id {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gray);
      margin-top: 8px;
    }

    .empty-state {
      background: var(--light-gray);
      padding: 40px 20px;
      text-align: center;
      color: var(--gray);
      font-size: 13px;
      border: 2px dashed var(--black);
      border-radius: 18px;
    }

    /* ==================== FOOTER ==================== */
    footer {
      padding: 32px 20px 28px;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 2.5px;
      color: var(--gray);
      text-transform: uppercase;
      border-top: 1px solid var(--light-gray);
      margin-top: 40px;
    }

    footer span {
      color: var(--neon);
    }

    /* ==================== MOCK TOGGLE ==================== */
    .mock-toggle {
      position: fixed;
      top: 12px;
      left: 12px;
      background: var(--black);
      color: var(--neon);
      padding: 8px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      border: 2px solid var(--neon);
      border-radius: 10px;
      box-shadow: 0 0 16px var(--neon-dim);
      cursor: pointer;
      z-index: 9999;
      user-select: none;
    }
  </style>
</head>
<body>
  <header class="hero">
    <span class="estd">estd, 2020</span>
    <img src="logo.png" alt="FANCY" class="logo-image">
    <div class="subtitle">specialty coffee roasting co.</div>
    <div class="marquee">{ warning } you gonna join a fantastic journey</div>
  </header>

  <main>
    <div id="loading" class="loading">LOADING ...</div>

    <div id="bindFormContainer" style="display:none;">
      <div class="bind-form">
        <h2>Bind Account</h2>
        <p class="hint">請輸入老闆給你的 6 位數綁定碼</p>
        <input type="text" id="bindCode" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="------">
        <button id="bindBtn" onclick="handleBind()">Connect</button>
        <div class="error" id="bindError"></div>
      </div>
    </div>

    <div id="balanceContainer" style="display:none;">
      <div class="vendor-header">
        <div class="label">Client</div>
        <div class="name" id="vendorName"></div>
      </div>
      <div class="section-label">Coffee Bean Deposits</div>
      <div id="depositsList"></div>
    </div>
  </main>

  <!-- ==================== ORDER MODAL (P2) ==================== -->
  <div class="modal-backdrop" id="orderModal">
    <div class="modal" id="orderModalBody">
      <h3>// 加入購物車</h3>
      <div class="deposit-info" id="orderDepositInfo"></div>
      <div class="balance-info" id="orderBalanceInfo"></div>
      <label>叫貨磅數 (LB)</label>
      <input type="number" id="orderQty" inputmode="decimal" step="0.5" min="0.5" placeholder="0">
      <div class="modal-error" id="orderError"></div>
      <div class="modal-actions">
        <button class="modal-cancel" onclick="closeOrderModal()">取消</button>
        <button class="modal-submit" id="orderSubmitBtn" onclick="confirmAddToCart()">加入購物車</button>
      </div>
    </div>
  </div>

  <!-- ==================== DEPOSIT DETAIL MODAL (P2.6) ==================== -->
  <div class="modal-backdrop" id="depositDetailModal">
    <div class="modal">
      <h3 id="depositDetailTitle">// 儲值明細</h3>
      <div class="deposit-detail-list" id="depositDetailList"></div>
      <div class="modal-actions">
        <button class="modal-submit" onclick="closeDepositDetail()">關閉</button>
      </div>
    </div>
  </div>

  <!-- ==================== CART FLOATING BAR (P2.5) ==================== -->
  <div class="cart-bar" id="cartBar" onclick="openCartPage()">
    <div class="cart-summary">
      <span class="cart-icon">🛒</span>
      <div class="cart-count-text">
        <span class="num" id="cartCount">0</span> 筆 · <span class="num" id="cartTotal">0</span> LB
      </div>
    </div>
    <div class="submit-arrow">送出 →</div>
  </div>

  <!-- ==================== CART FULLSCREEN PAGE (P2.5) ==================== -->
  <div class="cart-page" id="cartPage">
    <div class="cart-header">
      <button class="back-cart" onclick="closeCartPage()" aria-label="回上一頁">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12,19 5,12 12,5"/></svg>
      </button>
      <button class="close-cart" onclick="closeCartPage()">ADD MORE BEANS</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span class="label">合計</span>
        <span class="total-val"><span id="cartFooterCount">0</span> 筆 / <span id="cartFooterTotal">0</span><span class="unit">lb</span></span>
      </div>
      <button class="cart-submit" id="cartSubmitBtn" onclick="submitCart()">送出叫貨</button>
    </div>
  </div>

  <footer>
    FANCY 凡希咖啡 · estd <span>2020</span> · Taiwan
  </footer>

  <script>
    const LIFF_ID = '2010000242-22bEbIyz';
    const API_BASE = 'https://fancycaffe-bot.zeabur.app/webhook';

    let userId = null;

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        userId = profile.userId;
        await loadBalance();
      } catch (e) {
        console.error('LIFF init error:', e);
        document.getElementById('loading').textContent = 'INIT FAILED: ' + e.message;
      }
    }

    async function loadBalance() {
      try {
        const r = await fetch(`${API_BASE}/balance?userId=${encodeURIComponent(userId)}`);
        const data = await r.json();
        document.getElementById('loading').style.display = 'none';
        if (data.success) {
          showBalance(data);
        } else {
          showBindForm();
        }
      } catch (e) {
        document.getElementById('loading').textContent = 'NETWORK ERROR: ' + e.message;
      }
    }

    function showBindForm() {
      document.getElementById('bindFormContainer').style.display = 'block';
      document.getElementById('balanceContainer').style.display = 'none';
      setTimeout(() => document.getElementById('bindCode').focus(), 100);
    }

    function showBalance(data) {
      document.getElementById('balanceContainer').style.display = 'block';
      document.getElementById('bindFormContainer').style.display = 'none';
      document.getElementById('vendorName').textContent = data.vendor_name;

      const list = document.getElementById('depositsList');
      if (!data.deposits || data.deposits.length === 0) {
        list.innerHTML = `<div class="empty-state">目前沒有 active 儲值帳戶<br>請聯繫老闆開戶</div>`;
        return;
      }

      // 把 deposits 存到 window 給 modal 用
      window.__deposits = data.deposits;
      renderDeposits();
    }

    // Group deposits by bean_id
    function groupDepositsByBean(deposits) {
      const map = {};
      for (const d of deposits) {
        const key = d.bean_id || '_unknown';
        if (!map[key]) {
          map[key] = {
            bean_id: d.bean_id,
            bean_name: d.bean_name || '',
            deposits: [],
            total_balance: 0,
            total_initial: 0,
            earliest_opened: null
          };
        }
        map[key].deposits.push(d);
        map[key].total_balance += parseFloat(d.qty_balance_lb || 0);
        map[key].total_initial += parseFloat(d.qty_initial_lb || 0);
        const openedAt = d.opened_at || '';
        if (!map[key].earliest_opened || (openedAt && openedAt < map[key].earliest_opened)) {
          map[key].earliest_opened = openedAt;
        }
      }
      return map;
    }

    function renderDeposits() {
      const list = document.getElementById('depositsList');
      const deposits = window.__deposits || [];
      const groupsMap = groupDepositsByBean(deposits);
      const groups = Object.values(groupsMap);

      if (groups.length === 0) {
        list.innerHTML = `<div class="empty-state">目前沒有 active 儲值帳戶<br>請聯繫老闆開戶</div>`;
        return;
      }

      list.innerHTML = groups.map(g => {
        const totalBalance = g.total_balance;
        const totalInitial = g.total_initial;
        const beanLabel = g.bean_name
          ? `<span class="bean-id-tag">${g.bean_id}</span> ${g.bean_name}`
          : (g.bean_id || '(未知)');
        const canOrder = totalBalance >= 0.5;
        const depositCount = g.deposits.length;
        const isMulti = depositCount > 1;

        // cart 內該 bean 的 qty 總和（同 bean cart 限 1 筆，所以實際就是該 1 筆 qty）
        let cartTotal = 0;
        for (const item of cart.values()) {
          if (item.bean_id === g.bean_id) cartTotal += item.qty_lb;
        }

        // G: 進度條雙層 — 綠（扣完後剩）+ 螢光綠斜紋（即將被扣）
        const balanceAfter = Math.max(0, totalBalance - cartTotal);
        const fillPct = totalInitial > 0 ? (balanceAfter / totalInitial) * 100 : 0;
        const deductPct = totalInitial > 0 ? (Math.min(cartTotal, totalBalance) / totalInitial) * 100 : 0;

        const headerLine = isMulti
          ? `<div class="deposit-id"><span class="deposit-count-chip" onclick="openDepositDetail('${g.bean_id}')">${depositCount} 筆儲值 ›</span></div>`
          : `<div class="deposit-id">${g.deposits[0].deposit_id || ''}</div>`;

        return `
          <div class="deposit-card" data-bean-id="${g.bean_id}">
            ${cartTotal > 0 ? `<div class="cart-badge">✓ 已加 ${cartTotal} lb</div>` : ''}
            ${headerLine}
            <div class="deposit-bean">${beanLabel}</div>
            <div class="balance-row">
              <span class="balance-num">${totalBalance}</span>
              <span class="balance-total">/ ${totalInitial}</span>
              <span class="balance-unit">lb</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${fillPct}%"></div>
              ${cartTotal > 0 ? `<div class="progress-fill-deducted" style="width:${deductPct}%; left:${fillPct}%"></div>` : ''}
            </div>
            <div class="deposit-meta">opened · ${g.earliest_opened || '-'}${isMulti ? ' (最早)' : ''}</div>
            ${canOrder ? (
              cartTotal > 0
                ? `<button class="order-btn edit-cart" onclick="openOrderModal('${g.bean_id}')">修改</button>`
                : `<button class="order-btn add-to-cart" onclick="openOrderModal('${g.bean_id}')">加入購物車</button>`
            ) : ''}
          </div>
        `;
      }).join('');
    }

    // 開啟 deposit 明細 modal（同 bean 多筆 deposit 展開看每筆細節）
    function openDepositDetail(beanId) {
      const deposits = window.__deposits || [];
      const groupsMap = groupDepositsByBean(deposits);
      const group = groupsMap[beanId];
      if (!group) return;

      const beanLabel = group.bean_name
        ? `<span class="bean-id-tag">${group.bean_id}</span> ${group.bean_name}`
        : group.bean_id;

      document.getElementById('depositDetailTitle').innerHTML = `// 儲值明細 — ${beanLabel}`;

      // 依 opened_at 排序（早→晚）
      const sorted = [...group.deposits].sort((a, b) =>
        (a.opened_at || '').localeCompare(b.opened_at || '')
      );

      const list = document.getElementById('depositDetailList');
      list.innerHTML = sorted.map(d => `
        <div class="deposit-detail-item">
          <div class="did">${d.deposit_id}</div>
          <div class="qty-row">
            <span class="qty-num">${d.qty_balance_lb}</span>
            <span class="qty-total">/ ${d.qty_initial_lb}</span>
            <span class="qty-unit">lb</span>
          </div>
          <div class="opened">opened · ${d.opened_at || '-'}</div>
        </div>
      `).join('');

      document.getElementById('depositDetailModal').classList.add('active');
    }

    function closeDepositDetail() {
      document.getElementById('depositDetailModal').classList.remove('active');
    }

    async function handleBind() {
      const codeEl = document.getElementById('bindCode');
      const errorEl = document.getElementById('bindError');
      const btnEl = document.getElementById('bindBtn');
      const code = codeEl.value.trim();
      errorEl.textContent = '';

      if (!code || code.length !== 6 || !/^\d{6}$/.test(code)) {
        errorEl.textContent = 'Please enter 6-digit code';
        return;
      }

      // 本機預覽模式：假裝綁定成功
      if (MOCK_MODE) {
        btnEl.disabled = true;
        btnEl.textContent = 'Connecting...';
        setTimeout(() => {
          renderMock('bound');
          btnEl.disabled = false;
          btnEl.textContent = 'Connect';
          codeEl.value = '';
        }, 600);
        return;
      }

      btnEl.disabled = true;
      btnEl.textContent = 'Connecting...';

      try {
        const r = await fetch(`${API_BASE}/bind`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bind_code: code, line_login_user_id: userId })
        });
        const data = await r.json();

        if (data.success) {
          document.getElementById('bindFormContainer').style.display = 'none';
          document.getElementById('loading').style.display = 'block';
          document.getElementById('loading').textContent = `WELCOME ${data.vendor_name}`;
          setTimeout(() => loadBalance(), 800);
        } else {
          errorEl.textContent = data.error || '綁定失敗，請聯繫老闆';
          btnEl.disabled = false;
          btnEl.textContent = 'Connect';
        }
      } catch (e) {
        errorEl.textContent = 'NETWORK ERROR: ' + e.message;
        btnEl.disabled = false;
        btnEl.textContent = 'Connect';
      }
    }

    document.getElementById('bindCode').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleBind();
    });

    // ==================== CART STATE (P2.5 + P2.6) ====================
    // key: deposit_id, value: { deposit_id, qty_lb, bean_id, bean_name, balance }
    // 同 bean 限 1 筆 cart entry（confirmAddToCart 內保證）
    const cart = new Map();
    let currentOrderBeanId = null;
    let currentOrderDepositId = null;

    function openOrderModal(beanId) {
      const deposits = window.__deposits || [];
      const groupsMap = groupDepositsByBean(deposits);
      const group = groupsMap[beanId];
      if (!group) return;

      currentOrderBeanId = beanId;
      const beanLabel = group.bean_name
        ? `<span class="bean-id-tag">${group.bean_id}</span> ${group.bean_name}`
        : group.bean_id;

      // cart 內該 bean 的 entry（同 bean 限 1 筆，find 第一個）
      const existingCartEntry = [...cart.values()].find(c => c.bean_id === beanId);
      const isEditing = !!existingCartEntry;

      // 依 opened_at 排序（早→晚），FIFO 預設選最早
      const sortedDeposits = [...group.deposits].sort((a, b) =>
        (a.opened_at || '').localeCompare(b.opened_at || '')
      );

      // 預選 deposit：editing → 用 cart 內已記的；新增 → FIFO（最早）
      const selectedDepositId = isEditing
        ? existingCartEntry.deposit_id
        : sortedDeposits[0].deposit_id;
      currentOrderDepositId = selectedDepositId;

      const currentQty = isEditing ? existingCartEntry.qty_lb : '';
      const title = isEditing ? '// 修改數量' : '// 加入購物車';
      const submitLabel = isEditing ? '更新' : '加入購物車';
      const cancelBtn = isEditing
        ? `<button class="modal-cancel" onclick="removeFromCart('${selectedDepositId}')">移出購物車</button>`
        : `<button class="modal-cancel" onclick="closeOrderModal()">取消</button>`;

      // 多筆 deposit 才顯示 selector
      const isMulti = group.deposits.length > 1;
      const selectorHtml = isMulti ? `
        <div class="deposit-selector-wrap">
          <label class="deposit-selector-label">從哪筆扣？</label>
          <select class="deposit-selector" id="depositSelector" onchange="onDepositSelectorChange()">
            ${sortedDeposits.map((d, idx) => {
              const fifoTag = (idx === 0 && !isEditing) ? 'FIFO · ' : '';
              return `<option value="${d.deposit_id}" ${d.deposit_id === selectedDepositId ? 'selected' : ''}>${fifoTag}${d.deposit_id} · ${d.opened_at || ''} · 餘 ${d.qty_balance_lb} lb</option>`;
            }).join('')}
          </select>
        </div>
      ` : '';

      const selectedDeposit = sortedDeposits.find(d => d.deposit_id === selectedDepositId);
      const balance = parseFloat(selectedDeposit.qty_balance_lb || 0);

      document.getElementById('orderModalBody').innerHTML = `
        <h3>${title}</h3>
        <div class="deposit-info">${beanLabel}</div>
        <div class="balance-info" id="orderBalanceInfo">Available: ${balance} LB</div>
        ${selectorHtml}
        <label>叫貨磅數 (LB)</label>
        <input type="number" id="orderQty" inputmode="decimal" step="0.5" min="0.5" max="${balance}" value="${currentQty}" placeholder="0" oninput="updateBalancePreview()">
        <div class="quick-chips">
          <button class="chip" type="button" onclick="addChipValue(2)">+2</button>
          <button class="chip" type="button" onclick="addChipValue(10)">+10</button>
          <button class="chip" type="button" onclick="addChipValue(50)">+50</button>
        </div>
        <div class="modal-error" id="orderError"></div>
        <div class="modal-actions">
          ${cancelBtn}
          <button class="modal-submit" id="orderSubmitBtn" onclick="confirmAddToCart()">${submitLabel}</button>
        </div>
      `;
      document.getElementById('orderModal').classList.add('active');
      updateBalancePreview();
    }

    // dropdown 切換 → 更新 currentOrderDepositId + max qty + balance preview
    function onDepositSelectorChange() {
      const selector = document.getElementById('depositSelector');
      if (!selector) return;
      currentOrderDepositId = selector.value;

      const deposits = window.__deposits || [];
      const selectedDeposit = deposits.find(d => d.deposit_id === currentOrderDepositId);
      if (!selectedDeposit) return;

      const balance = parseFloat(selectedDeposit.qty_balance_lb || 0);
      const input = document.getElementById('orderQty');
      if (input) {
        input.max = balance;
        // 若已填值超過新 max，截到 max
        const cur = parseFloat(input.value) || 0;
        if (cur > balance) input.value = balance;
      }
      document.getElementById('orderBalanceInfo').textContent = `Available: ${balance} LB`;
      updateBalancePreview();
    }

    // X: input 變化時即時更新 modal 預扣顯示「579 → 449 LB」
    function updateBalancePreview() {
      const input = document.getElementById('orderQty');
      const info = document.getElementById('orderBalanceInfo');
      if (!input || !info || !currentOrderDepositId) return;
      const deposits = window.__deposits || [];
      const d = deposits.find(item => item.deposit_id === currentOrderDepositId);
      if (!d) return;
      const balance = parseFloat(d.qty_balance_lb || 0);
      const qty = parseFloat(input.value) || 0;
      if (qty > 0 && qty <= balance) {
        const after = balance - qty;
        const afterDisplay = after % 1 === 0 ? after : after.toFixed(1);
        info.innerHTML = `Available: <span class="bal-from">${balance}</span><span class="bal-arrow">→</span><span class="bal-after">${afterDisplay}</span> LB`;
      } else {
        info.textContent = `Available: ${balance} LB`;
      }
    }

    function closeOrderModal() {
      document.getElementById('orderModal').classList.remove('active');
      currentOrderBeanId = null;
      currentOrderDepositId = null;
    }

    // A: chip 點擊累加（不 focus input，避免鍵盤跳出）
    function addChipValue(val) {
      const input = document.getElementById('orderQty');
      if (!input) return;
      const cur = parseFloat(input.value) || 0;
      const max = parseFloat(input.max) || Infinity;
      input.value = Math.min(cur + val, max);
      input.dispatchEvent(new Event('input', { bubbles: true }));  // 觸發即時預扣顯示
    }

    // 純前端：加入購物車 / 更新數量（不打 API）
    function confirmAddToCart() {
      const qtyEl = document.getElementById('orderQty');
      const errEl = document.getElementById('orderError');
      const btn = document.getElementById('orderSubmitBtn');
      const qty = parseFloat(qtyEl.value);

      if (!currentOrderDepositId) {
        errEl.textContent = '⚠️ 缺少 deposit 選擇';
        return;
      }
      const deposits = window.__deposits || [];
      const d = deposits.find(item => item.deposit_id === currentOrderDepositId);
      if (!d) {
        errEl.textContent = '⚠️ 找不到對應儲值';
        return;
      }
      const balance = parseFloat(d.qty_balance_lb || 0);

      errEl.textContent = '';

      if (!qty || qty <= 0) {
        errEl.textContent = '⚠️ 請輸入有效磅數';
        return;
      }
      if (qty < 0.5) {
        errEl.textContent = '⚠️ 最低訂貨 0.5 磅';
        return;
      }
      if (qty > balance) {
        errEl.textContent = `⚠️ 該筆餘額只有 ${balance} 磅`;
        return;
      }

      // D: 0.2 秒 button success 反饋（綠底 + ✓ icon）
      btn.disabled = true;
      btn.classList.add('success');
      btn.innerHTML = `<svg class="check-svg" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>已加入`;

      setTimeout(() => {
        // 同 bean 限 1 筆：先刪 cart 內所有同 bean_id 的 entry（避免客戶換 deposit 後留兩筆）
        for (const [key, item] of [...cart.entries()]) {
          if (item.bean_id === d.bean_id) cart.delete(key);
        }
        // 加新 entry
        cart.set(d.deposit_id, {
          deposit_id: d.deposit_id,
          qty_lb: qty,
          bean_id: d.bean_id,
          bean_name: d.bean_name || '',
          balance: balance
        });
        closeOrderModal();
        renderDeposits();
        // B: 飛入動畫（cart bar 數字更新延後到飛入結束）
        flyToCart(d.deposit_id, qty);
      }, 200);
    }

    // B: 從 deposit card 飛 pill 到 cart bar
    function flyToCart(depositId, qty) {
      // 合併卡是按 bean_id 顯示，找對應的 deposit 拿 bean_id 再找 card
      const deposits = window.__deposits || [];
      const d = deposits.find(item => item.deposit_id === depositId);
      const beanId = d ? d.bean_id : null;
      const card = beanId
        ? document.querySelector(`.deposit-card[data-bean-id="${beanId}"]`)
        : null;
      const bar = document.getElementById('cartBar');
      const wasActive = bar.classList.contains('active');

      // 找不到 card（例如剛 render 還沒進 DOM）→ 直接 update bar + pulse
      if (!card) {
        renderCartBar();
        pulseCartBar();
        return;
      }

      const cardRect = card.getBoundingClientRect();
      const pill = document.createElement('div');
      pill.className = 'flying-pill';
      pill.textContent = `+${qty} LB`;
      const startX = cardRect.left + cardRect.width / 2 - 32;
      const startY = cardRect.top + cardRect.height / 2 - 14;
      pill.style.left = startX + 'px';
      pill.style.top = startY + 'px';
      document.body.appendChild(pill);

      // 目標位置：cart bar 已顯示 → bar 左中；未顯示 → 視窗底部中央
      let targetX, targetY;
      if (wasActive) {
        const barRect = bar.getBoundingClientRect();
        targetX = (barRect.left + 30) - startX;
        targetY = (barRect.top + barRect.height / 2 - 8) - startY;
      } else {
        targetX = (window.innerWidth / 2 - 32) - startX;
        targetY = (window.innerHeight - 50) - startY;
      }

      pill.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${targetX/2}px, ${targetY - 80}px) scale(1.15)`, opacity: 1, offset: 0.55 },
        { transform: `translate(${targetX}px, ${targetY}px) scale(0.6)`, opacity: 0 }
      ], { duration: 550, easing: 'cubic-bezier(.4,-0.2,.5,1)' }).onfinish = () => {
        pill.remove();
        renderCartBar();   // 數字更新
        pulseCartBar();    // C: pulse 反饋
      };
    }

    // C: cart bar 脈衝動畫
    function pulseCartBar() {
      const bar = document.getElementById('cartBar');
      bar.classList.remove('pulsing');
      void bar.offsetWidth;  // force reflow
      bar.classList.add('pulsing');
      setTimeout(() => bar.classList.remove('pulsing'), 600);
    }

    function removeFromCart(depositId) {
      cart.delete(depositId);
      closeOrderModal();
      renderDeposits();
      renderCartBar();
      if (cart.size > 0 && document.getElementById('cartPage').classList.contains('active')) {
        renderCartItems();
      } else if (cart.size === 0) {
        closeCartPage();
      }
    }

    // ==================== CART BAR / PAGE (P2.5) ====================
    function renderCartBar() {
      const bar = document.getElementById('cartBar');
      if (cart.size === 0) {
        bar.classList.remove('active');
        return;
      }
      let totalLb = 0;
      for (const v of cart.values()) totalLb += v.qty_lb;
      document.getElementById('cartCount').textContent = cart.size;
      document.getElementById('cartTotal').textContent = totalLb % 1 === 0 ? totalLb : totalLb.toFixed(1);
      bar.classList.add('active');
    }

    function openCartPage() {
      if (cart.size === 0) return;
      renderCartItems();
      document.getElementById('cartPage').classList.add('active');
    }

    function closeCartPage() {
      document.getElementById('cartPage').classList.remove('active');
    }

    function renderCartItems() {
      const wrap = document.getElementById('cartItems');
      if (cart.size === 0) {
        wrap.innerHTML = `<div class="cart-empty">// 購物車是空的</div>`;
        document.getElementById('cartSubmitBtn').disabled = true;
        document.getElementById('cartFooterCount').textContent = '0';
        document.getElementById('cartFooterTotal').textContent = '0';
        return;
      }
      const items = [...cart.values()];
      let totalLb = 0;
      wrap.innerHTML = items.map(it => {
        totalLb += it.qty_lb;
        const beanLabel = it.bean_name
          ? `<span class="bean-id-tag">${it.bean_id}</span> ${it.bean_name}`
          : it.bean_id;
        return `
          <div class="cart-item" data-deposit-id="${it.deposit_id}">
            <div class="item-deposit-id">${it.deposit_id}</div>
            <div class="item-bean">${beanLabel}</div>
            <div class="item-qty-row">
              <div class="qty-controls">
                <button class="qty-btn minus" onclick="adjustCartQty('${it.deposit_id}', -0.5)" aria-label="減少"></button>
                <input class="qty-input" type="number" inputmode="decimal" step="0.5" min="0.5" max="${it.balance}" value="${it.qty_lb}" onchange="setCartQty('${it.deposit_id}', this.value)">
                <button class="qty-btn plus" onclick="adjustCartQty('${it.deposit_id}', 0.5)" aria-label="增加"></button>
                <span class="qty-unit">lb</span>
              </div>
              <button class="remove-btn" onclick="removeFromCart('${it.deposit_id}')">✕</button>
            </div>
            <div class="item-balance-hint">餘額 ${it.balance} lb</div>
          </div>
        `;
      }).join('');
      document.getElementById('cartFooterCount').textContent = cart.size;
      document.getElementById('cartFooterTotal').textContent = totalLb % 1 === 0 ? totalLb : totalLb.toFixed(1);
      document.getElementById('cartSubmitBtn').disabled = false;
    }

    function adjustCartQty(depositId, delta) {
      const it = cart.get(depositId);
      if (!it) return;
      const newQty = Math.round((it.qty_lb + delta) * 2) / 2;  // 0.5 為單位
      setCartQty(depositId, newQty);
    }

    function setCartQty(depositId, value) {
      const it = cart.get(depositId);
      if (!it) return;
      let qty = parseFloat(value);
      if (isNaN(qty) || qty < 0.5) qty = 0.5;
      if (qty > it.balance) qty = it.balance;
      qty = Math.round(qty * 2) / 2;
      it.qty_lb = qty;
      cart.set(depositId, it);
      renderCartItems();
      renderDeposits();
      renderCartBar();
    }

    async function submitCart() {
      if (cart.size === 0) return;
      const items = [...cart.values()].map(it => ({
        deposit_id: it.deposit_id,
        qty_lb: it.qty_lb
      }));
      const btn = document.getElementById('cartSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'SENDING ...';

      // Mock mode
      if (MOCK_MODE) {
        setTimeout(() => {
          showCartSuccess('BATCHMOCK1234', items.length);
        }, 600);
        return;
      }

      // 向下相容：P2 後端 batch 還沒上線時，1 筆走舊格式，後端 work；N 筆要等 P2
      const body = items.length === 1
        ? { line_login_user_id: userId, deposit_id: items[0].deposit_id, qty_lb: items[0].qty_lb }
        : { line_login_user_id: userId, items: items };

      try {
        const r = await fetch(`${API_BASE}/order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await r.json();
        if (data.success) {
          showCartSuccess(data.batch_id || data.order_id, items.length);
        } else {
          btn.disabled = false;
          btn.textContent = '送出叫貨';
          alert(data.error || '送單失敗，請稍後再試');
        }
      } catch (e) {
        btn.disabled = false;
        btn.textContent = '送出叫貨';
        alert('NETWORK ERROR: ' + e.message);
      }
    }

    function showCartSuccess(batchId, count) {
      // 用 modal 顯示成功
      document.getElementById('orderModalBody').innerHTML = `
        <div class="success-state">
          <div class="check">✓</div>
          <div class="deposit-info">${count} 筆訂單已送出</div>
          <div class="balance-info">老闆收到通知後會處理</div>
          <div class="order-id">${batchId || '-'}</div>
        </div>
        <div class="modal-actions" style="margin-top: 20px;">
          <button class="modal-submit" onclick="closeOrderModal()">完成</button>
        </div>
      `;
      document.getElementById('orderModal').classList.add('active');
      // 清空 cart + 關 cart 頁
      cart.clear();
      closeCartPage();
      renderCartBar();
      renderDeposits();
      // 2 秒後自動關 modal 並 reload balance（讓客戶看到「老闆已通知」一下下）
      setTimeout(() => {
        if (document.getElementById('orderModal').classList.contains('active')) {
          closeOrderModal();
        }
        if (!MOCK_MODE) loadBalance();
      }, 2000);
    }

    // ==================== MOCK PREVIEW ====================
    const MOCK_MODE = typeof liff === 'undefined';

    if (MOCK_MODE) {
      runMockPreview();
    } else {
      init();
    }

    function runMockPreview() {
      userId = 'U_mock_dummy';

      const toggle = document.createElement('div');
      toggle.className = 'mock-toggle';
      toggle.textContent = '> Preview · Tap to toggle';
      let mockState = 'bound';
      toggle.onclick = () => {
        mockState = mockState === 'bound' ? 'unbound' : 'bound';
        renderMock(mockState);
      };
      document.body.appendChild(toggle);

      renderMock('bound');
    }

    function renderMock(state) {
      document.getElementById('loading').style.display = 'none';
      if (state === 'unbound') {
        showBindForm();
      } else {
        showBalance({
          success: true,
          vendor_id: 'V001',
          vendor_name: '木商咖啡',
          deposits: [
            { deposit_id: 'D0001', bean_id: 'B001', bean_name: '薩爾瓦多 甜心寶貝', qty_initial_lb: 60, qty_balance_lb: 57, opened_at: '2026-05-07' },
            { deposit_id: 'D0002', bean_id: 'B003', bean_name: '衣索比亞 耶加雪菲 G1', qty_initial_lb: 30, qty_balance_lb: 12, opened_at: '2026-04-15' },
            { deposit_id: 'D0003', bean_id: 'B005', bean_name: '哥斯大黎加 莫札特卡內特莊園', qty_initial_lb: 20, qty_balance_lb: 5, opened_at: '2026-03-20' }
          ]
        });
      }
    }
  </script>
</body>
</html>
