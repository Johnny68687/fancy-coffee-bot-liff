<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FANCY 凡希｜訂豆專員</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon: #39FF14;
      --neon-dim: rgba(57, 255, 20, 0.5);
      --black: #0A0A0A;
      --white: #FFFFFF;
      --gray: #86868b;
      --light-gray: #f5f5f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', -apple-system, system-ui, sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ==================== HERO ==================== */
    .hero {
      background: var(--black);
      color: var(--white);
      padding: 36px 20px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(57, 255, 20, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(57, 255, 20, 0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    .hero .estd {
      position: absolute;
      top: 14px;
      right: 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--neon);
      text-transform: uppercase;
      z-index: 1;
    }

    .hero .logo-image {
      height: 60px;
      width: auto;
      margin: 0 auto 10px;
      display: block;
      /* 把黑色 logo 變螢光綠 + glow（兼容 file://）*/
      filter:
        brightness(0) saturate(100%)
        invert(82%) sepia(82%)
        saturate(2476%) hue-rotate(63deg)
        brightness(115%) contrast(102%)
        drop-shadow(0 0 12px rgba(57, 255, 20, 0.6))
        drop-shadow(0 0 32px rgba(57, 255, 20, 0.3));
      position: relative;
      z-index: 1;
    }

    .hero .subtitle {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--white);
      opacity: 0.7;
      position: relative;
      z-index: 1;
    }

    .hero .marquee {
      margin-top: 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--neon);
      opacity: 0.6;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    /* ==================== MAIN ==================== */
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--gray);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ==================== BIND FORM ==================== */
    .bind-form {
      background: var(--white);
      padding: 32px 24px;
      border: 2px solid var(--black);
      border-radius: 18px;
    }

    .bind-form h2 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 8px;
    }

    .bind-form .hint {
      font-size: 12px;
      color: var(--gray);
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .bind-form input {
      width: 100%;
      padding: 18px 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 16px;
      border: 2px solid var(--black);
      border-radius: 18px;
      background: var(--white);
      color: var(--black);
      margin-bottom: 16px;
      outline: none;
      transition: all 0.15s;
    }

    .bind-form input:focus {
      background: var(--black);
      color: var(--neon);
      border-color: var(--neon);
      box-shadow: 0 0 16px var(--neon-dim);
    }

    button {
      width: 100%;
      padding: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: var(--black);
      color: var(--neon);
      border: 2px solid var(--black);
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.15s;
    }

    button:hover, button:active {
      background: var(--neon);
      color: var(--black);
      border-color: var(--neon);
      box-shadow: 0 0 20px var(--neon-dim);
    }

    button:disabled {
      background: var(--light-gray);
      color: var(--gray);
      border-color: var(--light-gray);
      cursor: not-allowed;
      box-shadow: none;
    }

    .error {
      color: #ff3b30;
      font-size: 11px;
      text-align: center;
      margin-top: 12px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 1px;
    }

    /* ==================== VENDOR HEADER ==================== */
    .vendor-header {
      padding: 8px 0 18px;
      border-bottom: 2px solid var(--black);
      margin-bottom: 20px;
    }

    .vendor-header .label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 4px;
    }

    .vendor-header .name {
      font-size: 26px;
      font-weight: 900;
      color: var(--black);
    }

    .section-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin: 20px 0 12px;
    }

    .section-label::before {
      content: '// ';
      color: var(--neon);
    }

    /* ==================== DEPOSIT CARD ==================== */
    .deposit-card {
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: 18px;
      padding: 20px 20px 18px 24px;
      margin-bottom: 12px;
      position: relative;
      transition: transform 0.15s;
    }

    .deposit-card:hover {
      transform: translateX(2px);
    }

    .deposit-card::before {
      content: '';
      position: absolute;
      top: 14px;
      bottom: 14px;
      left: 0;
      width: 5px;
      background: var(--neon);
      border-radius: 0 4px 4px 0;
      box-shadow: 0 0 10px var(--neon-dim);
    }

    .deposit-card .deposit-id {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--gray);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .deposit-card .deposit-bean {
      font-size: 16px;
      font-weight: 700;
      color: var(--black);
      margin-bottom: 18px;
      line-height: 1.35;
    }

    .deposit-card .bean-id-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--gray);
      background: var(--light-gray);
      padding: 2px 8px;
      border-radius: 6px;
      margin-right: 6px;
      vertical-align: middle;
      font-weight: 500;
    }

    .deposit-card .balance-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .deposit-card .balance-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 38px;
      font-weight: 700;
      color: var(--black);
      line-height: 1;
    }

    .deposit-card .balance-total {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      color: var(--gray);
    }

    .deposit-card .balance-unit {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gray);
      text-transform: uppercase;
      margin-left: 4px;
    }

    .progress-bar {
      height: 8px;
      background: var(--black);
      position: relative;
      overflow: hidden;
      margin: 14px 0 10px;
      border-radius: 4px;
    }

    .progress-fill {
      height: 100%;
      background: var(--neon);
      box-shadow: 0 0 8px var(--neon-dim);
      transition: width 0.5s ease;
    }

    .deposit-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--gray);
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* ==================== ORDER BUTTON (P2) ==================== */
    .order-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      background: var(--black);
      color: var(--neon);
      border: 2px solid var(--black);
      border-radius: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }
    .order-btn:hover, .order-btn:active {
      background: var(--neon);
      color: var(--black);
      border-color: var(--neon);
      box-shadow: 0 0 16px var(--neon-dim);
    }
    .order-btn::before {
      content: '+ ';
      color: var(--neon);
    }
    .order-btn:hover::before, .order-btn:active::before {
      color: var(--black);
    }

    /* ==================== MODAL ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: 18px;
      padding: 28px 24px 24px;
      max-width: 360px;
      width: 100%;
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal h3 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 6px;
    }
    .modal .deposit-info {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .modal .balance-info {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--gray);
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .modal label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--gray);
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }
    .modal input[type="number"] {
      width: 100%;
      padding: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      border: 2px solid var(--black);
      border-radius: 12px;
      background: var(--white);
      color: var(--black);
      margin-bottom: 8px;
      outline: none;
      -moz-appearance: textfield;
    }
    .modal input[type="number"]::-webkit-outer-spin-button,
    .modal input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .modal input[type="number"]:focus {
      background: var(--black);
      color: var(--neon);
      border-color: var(--neon);
      box-shadow: 0 0 16px var(--neon-dim);
    }
    .modal .modal-error {
      color: #ff3b30;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 1px;
      min-height: 16px;
      margin-bottom: 14px;
      text-align: center;
    }
    .modal .modal-actions {
      display: flex;
      gap: 10px;
    }
    .modal .modal-actions button {
      flex: 1;
      padding: 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 12px;
      cursor: pointer;
    }
    .modal .modal-cancel {
      background: var(--white);
      color: var(--black);
      border: 2px solid var(--black);
    }
    .modal .modal-submit {
      background: var(--black);
      color: var(--neon);
      border: 2px solid var(--black);
    }
    .modal .modal-submit:disabled {
      background: var(--light-gray);
      color: var(--gray);
      border-color: var(--light-gray);
    }
    .modal .success-state {
      text-align: center;
      padding: 12px 0;
    }
    .modal .success-state .check {
      font-size: 48px;
      color: var(--neon);
      filter: drop-shadow(0 0 8px var(--neon-dim));
      margin-bottom: 12px;
    }
    .modal .success-state .order-id {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gray);
      margin-top: 8px;
    }

    .empty-state {
      background: var(--light-gray);
      padding: 40px 20px;
      text-align: center;
      color: var(--gray);
      font-size: 13px;
      border: 2px dashed var(--black);
      border-radius: 18px;
    }

    /* ==================== FOOTER ==================== */
    footer {
      padding: 32px 20px 28px;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 2.5px;
      color: var(--gray);
      text-transform: uppercase;
      border-top: 1px solid var(--light-gray);
      margin-top: 40px;
    }

    footer span {
      color: var(--neon);
    }

    /* ==================== MOCK TOGGLE ==================== */
    .mock-toggle {
      position: fixed;
      top: 12px;
      left: 12px;
      background: var(--black);
      color: var(--neon);
      padding: 8px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      border: 2px solid var(--neon);
      border-radius: 10px;
      box-shadow: 0 0 16px var(--neon-dim);
      cursor: pointer;
      z-index: 9999;
      user-select: none;
    }
  </style>
</head>
<body>
  <header class="hero">
    <span class="estd">estd, 2020</span>
    <img src="logo.png" alt="FANCY" class="logo-image">
    <div class="subtitle">specialty coffee roasting co.</div>
    <div class="marquee">{ warning } you gonna join a fantastic journey</div>
  </header>

  <main>
    <div id="loading" class="loading">LOADING ...</div>

    <div id="bindFormContainer" style="display:none;">
      <div class="bind-form">
        <h2>Bind Account</h2>
        <p class="hint">請輸入老闆給你的 6 位數綁定碼</p>
        <input type="text" id="bindCode" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="------">
        <button id="bindBtn" onclick="handleBind()">Connect</button>
        <div class="error" id="bindError"></div>
      </div>
    </div>

    <div id="balanceContainer" style="display:none;">
      <div class="vendor-header">
        <div class="label">Client</div>
        <div class="name" id="vendorName"></div>
      </div>
      <div class="section-label">Coffee Bean Deposits</div>
      <div id="depositsList"></div>
    </div>
  </main>

  <!-- ==================== ORDER MODAL (P2) ==================== -->
  <div class="modal-backdrop" id="orderModal">
    <div class="modal" id="orderModalBody">
      <h3>// 叫貨</h3>
      <div class="deposit-info" id="orderDepositInfo"></div>
      <div class="balance-info" id="orderBalanceInfo"></div>
      <label>叫貨磅數 (LB)</label>
      <input type="number" id="orderQty" inputmode="decimal" step="0.5" min="0.5" placeholder="0">
      <div class="modal-error" id="orderError"></div>
      <div class="modal-actions">
        <button class="modal-cancel" onclick="closeOrderModal()">取消</button>
        <button class="modal-submit" id="orderSubmitBtn" onclick="submitOrder()">送出訂單</button>
      </div>
    </div>
  </div>

  <footer>
    FANCY 凡希咖啡 · estd <span>2020</span> · Taiwan
  </footer>

  <script>
    const LIFF_ID = '2010000242-22bEbIyz';
    const API_BASE = 'https://fancycaffe-bot.zeabur.app/webhook';

    let userId = null;

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        userId = profile.userId;
        await loadBalance();
      } catch (e) {
        console.error('LIFF init error:', e);
        document.getElementById('loading').textContent = 'INIT FAILED: ' + e.message;
      }
    }

    async function loadBalance() {
      try {
        const r = await fetch(`${API_BASE}/balance?userId=${encodeURIComponent(userId)}`);
        const data = await r.json();
        document.getElementById('loading').style.display = 'none';
        if (data.success) {
          showBalance(data);
        } else {
          showBindForm();
        }
      } catch (e) {
        document.getElementById('loading').textContent = 'NETWORK ERROR: ' + e.message;
      }
    }

    function showBindForm() {
      document.getElementById('bindFormContainer').style.display = 'block';
      document.getElementById('balanceContainer').style.display = 'none';
      setTimeout(() => document.getElementById('bindCode').focus(), 100);
    }

    function showBalance(data) {
      document.getElementById('balanceContainer').style.display = 'block';
      document.getElementById('bindFormContainer').style.display = 'none';
      document.getElementById('vendorName').textContent = data.vendor_name;

      const list = document.getElementById('depositsList');
      if (!data.deposits || data.deposits.length === 0) {
        list.innerHTML = `<div class="empty-state">目前沒有 active 儲值帳戶<br>請聯繫老闆開戶</div>`;
        return;
      }

      list.innerHTML = data.deposits.map((d, i) => {
        const balance = parseFloat(d.qty_balance_lb || 0);
        const initial = parseFloat(d.qty_initial_lb || 0);
        const pct = initial > 0 ? Math.max(0, Math.min(100, (balance / initial) * 100)) : 0;
        // 優先顯示 bean_name，沒有就 fallback 到 bean_id
        const beanLabel = d.bean_name
          ? `<span class="bean-id-tag">${d.bean_id}</span> ${d.bean_name}`
          : d.bean_id;
        // 餘額不夠 0.5 磅就不顯示叫貨按鈕
        const canOrder = balance >= 0.5;
        return `
          <div class="deposit-card">
            <div class="deposit-id">${d.deposit_id}</div>
            <div class="deposit-bean">${beanLabel}</div>
            <div class="balance-row">
              <span class="balance-num">${balance}</span>
              <span class="balance-total">/ ${initial}</span>
              <span class="balance-unit">lb</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${pct}%"></div>
            </div>
            <div class="deposit-meta">opened · ${d.opened_at || '-'}</div>
            ${canOrder ? `<button class="order-btn" onclick="openOrderModal(${i})">叫貨</button>` : ''}
          </div>
        `;
      }).join('');

      // 把 deposits 存到 window 給 modal 用
      window.__deposits = data.deposits;
    }

    async function handleBind() {
      const codeEl = document.getElementById('bindCode');
      const errorEl = document.getElementById('bindError');
      const btnEl = document.getElementById('bindBtn');
      const code = codeEl.value.trim();
      errorEl.textContent = '';

      if (!code || code.length !== 6 || !/^\d{6}$/.test(code)) {
        errorEl.textContent = 'Please enter 6-digit code';
        return;
      }

      // 本機預覽模式：假裝綁定成功
      if (MOCK_MODE) {
        btnEl.disabled = true;
        btnEl.textContent = 'Connecting...';
        setTimeout(() => {
          renderMock('bound');
          btnEl.disabled = false;
          btnEl.textContent = 'Connect';
          codeEl.value = '';
        }, 600);
        return;
      }

      btnEl.disabled = true;
      btnEl.textContent = 'Connecting...';

      try {
        const r = await fetch(`${API_BASE}/bind`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bind_code: code, line_login_user_id: userId })
        });
        const data = await r.json();

        if (data.success) {
          document.getElementById('bindFormContainer').style.display = 'none';
          document.getElementById('loading').style.display = 'block';
          document.getElementById('loading').textContent = `WELCOME ${data.vendor_name}`;
          setTimeout(() => loadBalance(), 800);
        } else {
          errorEl.textContent = data.error || '綁定失敗，請聯繫老闆';
          btnEl.disabled = false;
          btnEl.textContent = 'Connect';
        }
      } catch (e) {
        errorEl.textContent = 'NETWORK ERROR: ' + e.message;
        btnEl.disabled = false;
        btnEl.textContent = 'Connect';
      }
    }

    document.getElementById('bindCode').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleBind();
    });

    // ==================== ORDER MODAL (P2) ====================
    let currentOrderDeposit = null;

    function openOrderModal(depositIndex) {
      const d = window.__deposits[depositIndex];
      if (!d) return;
      currentOrderDeposit = d;
      const balance = parseFloat(d.qty_balance_lb || 0);
      const beanLabel = d.bean_name ? `${d.bean_id} · ${d.bean_name}` : d.bean_id;
      document.getElementById('orderDepositInfo').textContent = `${d.deposit_id} ${beanLabel}`;
      document.getElementById('orderBalanceInfo').textContent = `Available: ${balance} LB`;
      document.getElementById('orderQty').value = '';
      document.getElementById('orderQty').max = balance;
      document.getElementById('orderError').textContent = '';
      document.getElementById('orderSubmitBtn').disabled = false;
      document.getElementById('orderSubmitBtn').textContent = '送出訂單';
      document.getElementById('orderModal').classList.add('active');
      setTimeout(() => document.getElementById('orderQty').focus(), 100);
    }

    function closeOrderModal() {
      document.getElementById('orderModal').classList.remove('active');
      currentOrderDeposit = null;
    }

    async function submitOrder() {
      const qtyEl = document.getElementById('orderQty');
      const errEl = document.getElementById('orderError');
      const btnEl = document.getElementById('orderSubmitBtn');
      const qty = parseFloat(qtyEl.value);
      const balance = parseFloat(currentOrderDeposit.qty_balance_lb || 0);

      errEl.textContent = '';

      // 驗證
      if (!qty || qty <= 0) {
        errEl.textContent = '⚠️ 請輸入有效磅數';
        return;
      }
      if (qty < 0.5) {
        errEl.textContent = '⚠️ 最低訂貨 0.5 磅';
        return;
      }
      if (qty > balance) {
        errEl.textContent = `⚠️ 您的餘額只有 ${balance} 磅`;
        return;
      }

      // Mock mode: 假裝成功
      if (MOCK_MODE) {
        btnEl.disabled = true;
        btnEl.textContent = 'Sending...';
        setTimeout(() => showOrderSuccess('ORDMOCK1234'), 500);
        return;
      }

      // 真實送單
      btnEl.disabled = true;
      btnEl.textContent = 'Sending...';

      try {
        const r = await fetch(`${API_BASE}/order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            line_login_user_id: userId,
            deposit_id: currentOrderDeposit.deposit_id,
            qty_lb: qty
          })
        });
        const data = await r.json();
        if (data.success) {
          showOrderSuccess(data.order_id);
        } else {
          errEl.textContent = data.error || '送單失敗，請稍後再試';
          btnEl.disabled = false;
          btnEl.textContent = '送出訂單';
        }
      } catch (e) {
        errEl.textContent = 'NETWORK ERROR: ' + e.message;
        btnEl.disabled = false;
        btnEl.textContent = '送出訂單';
      }
    }

    function showOrderSuccess(orderId) {
      const body = document.getElementById('orderModalBody');
      body.innerHTML = `
        <div class="success-state">
          <div class="check">✓</div>
          <div class="deposit-info">訂單已送出</div>
          <div class="balance-info">老闆收到通知後會處理</div>
          <div class="order-id">${orderId || '-'}</div>
        </div>
        <div class="modal-actions" style="margin-top: 20px;">
          <button class="modal-submit" onclick="closeOrderModalAndReload()">關閉</button>
        </div>
      `;
    }

    function closeOrderModalAndReload() {
      closeOrderModal();
      // 1 秒後重新整理餘額（給 sheet 一點時間）
      setTimeout(() => {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').textContent = 'REFRESHING ...';
        document.getElementById('balanceContainer').style.display = 'none';
        if (MOCK_MODE) renderMock('bound');
        else loadBalance();
      }, 500);
    }

    // ==================== MOCK PREVIEW ====================
    const MOCK_MODE = typeof liff === 'undefined';

    if (MOCK_MODE) {
      runMockPreview();
    } else {
      init();
    }

    function runMockPreview() {
      userId = 'U_mock_dummy';

      const toggle = document.createElement('div');
      toggle.className = 'mock-toggle';
      toggle.textContent = '> Preview · Tap to toggle';
      let mockState = 'bound';
      toggle.onclick = () => {
        mockState = mockState === 'bound' ? 'unbound' : 'bound';
        renderMock(mockState);
      };
      document.body.appendChild(toggle);

      renderMock('bound');
    }

    function renderMock(state) {
      document.getElementById('loading').style.display = 'none';
      if (state === 'unbound') {
        showBindForm();
      } else {
        showBalance({
          success: true,
          vendor_id: 'V001',
          vendor_name: '木商咖啡',
          deposits: [
            { deposit_id: 'D0001', bean_id: 'B001', bean_name: '薩爾瓦多 甜心寶貝', qty_initial_lb: 60, qty_balance_lb: 57, opened_at: '2026-05-07' },
            { deposit_id: 'D0002', bean_id: 'B003', bean_name: '衣索比亞 耶加雪菲 G1', qty_initial_lb: 30, qty_balance_lb: 12, opened_at: '2026-04-15' },
            { deposit_id: 'D0003', bean_id: 'B005', bean_name: '哥斯大黎加 莫札特卡內特莊園', qty_initial_lb: 20, qty_balance_lb: 5, opened_at: '2026-03-20' }
          ]
        });
      }
    }
  </script>
</body>
